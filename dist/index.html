<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Shoply — Everything Store</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('shoply_theme') || localStorage.getItem('velora_theme');
          var isDark = saved ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = isDark ? 'dark' : 'light';
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.removeAttribute('data-theme');
            root.style.colorScheme = 'light';
          }
          localStorage.setItem('shoply_theme', theme);
          localStorage.setItem('velora_theme', theme);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CbrK7kpF.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CCo3CSsk.css">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0b1120] dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
  </body>
</html>
